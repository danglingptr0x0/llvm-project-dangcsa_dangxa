name: dangcsa r2 fix

on:
  workflow_dispatch:

concurrency:
  group: dangcsa-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: 24.0.0git-r2-dangcsa_dangxa
  TARGET: aaadac3ac194d4284e946b0f730e260ed5b4cae1

jobs:
  fix:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'llvm-*-amd64.tar.xz' --dir src
          for p in linux windows; do
            gh attestation verify "src/llvm-${TAG}-${p}-amd64.tar.xz" --repo "$GITHUB_REPOSITORY"
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md

      - name: pack
        run: |
          set -euo pipefail
          for p in linux windows; do
            mkdir -p "work/$p"
            tar -xJf "src/llvm-${TAG}-${p}-amd64.tar.xz" -C "work/$p"
            find "work/$p" -type d -exec chmod 755 {} +
            find "work/$p" -type f -exec chmod 644 {} +
            chmod 755 "work/$p/$p/bin/"*
            tar -C "work/$p" --owner=0 --group=0 --numeric-owner -cJf "llvm-${TAG}-${p}-amd64.tar.xz" LICENSE.TXT "$p"
            tar -tvJf "llvm-${TAG}-${p}-amd64.tar.xz" "$p/bin"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fixed
          path: llvm-*-amd64.tar.xz

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: llvm-*-amd64.tar.xz

      - name: republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "$TAG" --latest --notes-file notes.md "llvm-${TAG}-linux-amd64.tar.xz" "llvm-${TAG}-windows-amd64.tar.xz"
