name: dangcsa r2 fix

on:
  workflow_dispatch:

concurrency:
  group: dangcsa-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: 24.0.0git-r2-dangcsa_dangxa
  NOTES: 'fix(ci): bump all action versions'

jobs:
  fix:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fixed
          run-id: 42051483949
          github-token: ${{ github.token }}
          path: fixed

      - name: check
        run: |
          set -euo pipefail
          for p in linux windows; do
            f="fixed/llvm-${TAG}-${p}-amd64.tar.xz"
            tar -tvJf "$f" "$p/bin"
            if tar -tvJf "$f" "$p/bin" | grep '^-' | grep -v '^-rwxr-xr-x'; then echo "non-executable entry in $p/bin"; exit 1; fi
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: fixed/llvm-*-amd64.tar.xz

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --latest --notes "$NOTES" "fixed/llvm-${TAG}-linux-amd64.tar.xz" "fixed/llvm-${TAG}-windows-amd64.tar.xz"
