name: codeql

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codeql
  cancel-in-progress: true

permissions:
  contents: read

env:
  TARGETS: LLVMdangcsaCodeGen LLVMdangcsaAsmParser LLVMdangcsaDisassembler LLVMdangcsaDesc LLVMdangcsaInfo llvm-reademiru clangBasic lldELF

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      security-events: write
    steps:
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: c-cpp
          build-mode: manual

      - name: configure
        run: >
          cmake -S llvm -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLLVM_ENABLE_ASSERTIONS=ON
          -DLLVM_ENABLE_PROJECTS="clang;lld"
          -DLLVM_TARGETS_TO_BUILD="X86;Sparc"
          -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD=dangcsa
          -DLLVM_ENABLE_LIBXML2=OFF
          -DLLVM_INCLUDE_BENCHMARKS=OFF
          -DLLVM_INCLUDE_EXAMPLES=OFF
          -DLLVM_INCLUDE_DOCS=OFF
          -DLLVM_INCLUDE_TESTS=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: build
        run: |
          read -ra targets <<< "$TARGETS"
          cmake --build build -j "$(nproc)" --target "${targets[@]}"

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:c-cpp

      - name: sonarqube
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=danglingptr0x0
            -Dsonar.projectKey=danglingptr0x0_llvm-project-dangcsa_dangxa
            -Dsonar.sources=llvm/lib/Target/dangcsa,clang/lib/Basic/Targets/dangcsa.cpp,clang/lib/Basic/Targets/dangcsa.h,lld/ELF/Arch/dangcsa.cpp,llvm/lib/Object/EMIRUObjectFile.cpp,llvm/include/llvm/Object/EMIRU.h,llvm/tools/llvm-reademiru
            -Dsonar.cfamily.compile-commands=build/compile_commands.json
